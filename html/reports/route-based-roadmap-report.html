<body>
    <div class="report-page report-route-based-roadmap-page">
        <div class="report-page-header">
            <h2 class="report-page-title">
                <i class="fas fa-route me-2"></i>
                BÁO CÁO LỘ TRÌNH THEO TUYẾN
            </h2>

        </div>
        <div class="report-page-body">
            <div class="report-filter-card report-route-based-roadmap-filter">
                <div class="report-filter-header">
                    <h5 class="report-filter-title">
                        <i class="fas fa-filter me-2"></i>
                        Bộ lọc
                    </h5>
                </div>
                <div class="report-filter-content">

                    <div class="row g-3 align-items-end">
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-route me-1"></i>
                                Tuyến xe
                            </label>
                            <div class="report-input-group">
                                <select class="report-form-control" id="routeBasedRoadmapRoute">
                                    <option value="route1" selected>La Tiến - Giáp Bát</option>
                                    <option value="route2">Mỹ Đình - Nam Thăng Long</option>
                                    <option value="route3">Nam Thăng Long - Mỹ Đình</option>
                                </select>
                                <i class="fas fa-chevron-down report-select-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-users me-1"></i>
                                Nhóm xe
                            </label>
                            <div class="report-input-group">
                                <select class="report-form-control" id="routeBasedRoadmapGroup">
                                    <option value="all" selected>Tất cả</option>
                                    <option value="group1">Nhóm 1</option>
                                    <option value="group2">Nhóm 2</option>
                                    <option value="group3">Nhóm 3</option>
                                </select>
                                <i class="fas fa-chevron-down report-select-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-car me-1"></i>
                                Biển số
                            </label>
                            <input type="text" class="report-form-control" placeholder="Nhập biển số"
                                id="routeBasedRoadmapPlate">
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Từ ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="routeBasedRoadmapDateFrom"
                                    value="27/11/20">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Đến ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="routeBasedRoadmapDateTo"
                                    value="27/11/20">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-clock me-1"></i>
                                Từ giờ
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" placeholder="00:00:00"
                                    id="routeBasedRoadmapTimeFrom">
                                <button type="button" class="report-time-btn">
                                    <i class="fas fa-clock"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-clock me-1"></i>
                                Đến giờ
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" placeholder="23:59:59"
                                    id="routeBasedRoadmapTimeTo">
                                <button type="button" class="report-time-btn">
                                    <i class="fas fa-clock"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-12">
                            <label for=""></label>
                            <button class="btn btn-primary report-submit-btn w-100" id="routeBasedRoadmapSubmit">

                                Xem báo cáo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="report-table-card report-route-based-roadmap-table">
                <div class="report-table-header">
                    <h5 class="report-table-title">
                        <i class="fas fa-table me-2"></i>
                        Dữ liệu báo cáo lộ trình theo tuyến
                    </h5>
                </div>
                <div class="report-table-wrapper">
                    <table class="table report-route-based-roadmap-table-content">
                        <thead>
                            <tr>
                                <th>Biển số</th>
                                <th>Bắt đầu/Kết thúc</th>
                                <th>Điểm xuất phát/Điểm kết thúc</th>
                                <th>Điểm kiểm tra (trạm)</th>
                                <th>Thời điểm đến</th>
                                <th>Thời gian ở</th>
                                <th>Dừng tại điểm</th>
                                <th>Km</th>
                                <th>Số lần dừng</th>
                                <th>Lũy kế dừng</th>
                                <th>Vượt tốc</th>
                                <th>Lũy kế vượt tốc</th>
                            </tr>
                        </thead>
                        <tbody id="routeBasedRoadmapTableBody">
                            <tr class="report-empty-row">
                                <td colspan="12" class="text-center py-5">
                                    <i class="fas fa-inbox fa-3x text-muted mb-3 d-block"></i>
                                    <p class="text-muted">Chưa có dữ liệu. Vui lòng chọn bộ lọc và nhấn "Xem báo cáo"
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
