<body>
    <div class="report-page report-summary-3d-page">
        <div class="report-page-header">
            <h2 class="report-page-title">
                <i class="fas fa-cube me-2"></i>
                BÁO CÁO TỔNG HỢP LÀM VIỆC THEO 3D
            </h2>

        </div>
        <div class="report-page-body">
            <div class="report-filter-card report-summary-3d-filter">
                <div class="report-filter-header">
                    <h5 class="report-filter-title">
                        <i class="fas fa-filter me-2"></i>
                        Bộ lọc
                    </h5>
                </div>
                <div class="report-filter-content">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-users me-1"></i>
                                Nhóm
                            </label>
                            <div class="report-input-group">
                                <select class="report-form-control" id="summary3dGroup">
                                    <option value="all" selected>Tất cả</option>
                                    <option value="group1">Nhóm 1</option>
                                    <option value="group2">Nhóm 2</option>
                                    <option value="group3">Nhóm 3</option>
                                </select>
                                <i class="fas fa-chevron-down report-select-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-car me-1"></i>
                                Biển số
                            </label>
                            <input type="text" class="report-form-control" placeholder="Nhập biển số"
                                id="summary3dPlate">
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Từ ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="summary3dDateFrom" value="27/11/20">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Đến ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="summary3dDateTo" value="27/11/20">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-12">
                            <label class="report-form-label">&nbsp;</label>
                            <button class="btn btn-primary report-submit-btn w-100" id="summary3dSubmit">

                                Xem báo cáo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="report-table-card report-summary-3d-table">
                <div class="report-table-header">
                    <h5 class="report-table-title">
                        <i class="fas fa-table me-2"></i>
                        Dữ liệu báo cáo tổng hợp làm việc theo 3D
                    </h5>
                </div>
                <div class="report-table-wrapper">
                    <table class="table report-summary-3d-table-content">
                        <thead>
                            <tr>
                                <th>Biển số</th>
                                <th>Ngày</th>
                                <th>Km</th>
                                <th>3D máy ON</th>
                                <th>Dừng nổ máy</th>
                                <th>Dừng tắt máy</th>
                                <th>Dầu tiêu thụ (lit)</th>
                                <th>Dầu cấp (lít)</th>
                            </tr>
                        </thead>
                        <tbody id="summary3dTableBody">
                            <tr class="report-empty-row">
                                <td colspan="8" class="text-center py-5">
                                    <i class="fas fa-inbox fa-3x text-muted mb-3 d-block"></i>
                                    <p class="text-muted">Chưa có dữ liệu. Vui lòng chọn bộ lọc và nhấn "Xem báo cáo"
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
