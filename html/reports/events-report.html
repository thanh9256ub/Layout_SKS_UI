<body>
    <div class="report-page report-events-page">
        <div class="report-page-header">
            <h2 class="report-page-title">
                <i class="fas fa-calendar-alt me-2"></i>
                BÁO CÁO SỰ KIỆN
            </h2>

        </div>
        <div class="report-page-body">
            <div class="report-filter-card report-events-filter">
                <div class="report-filter-header">
                    <h5 class="report-filter-title">
                        <i class="fas fa-filter me-2"></i>
                        Bộ lọc
                    </h5>
                </div>
                <div class="report-filter-content">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-car me-1"></i>
                                Biển số
                            </label>
                            <input type="text" class="report-form-control" placeholder="Nhập biển số" id="eventsPlate"
                                value="36F-010.12">
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="eventsDate" value="27/11/2025">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <div class="report-checkbox-wrapper">
                                <input type="checkbox" id="eventsLocationCheck" class="report-checkbox">
                                <label for="eventsLocationCheck" class="report-checkbox-label">
                                    Nhận diện địa điểm
                                </label>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-12">
                            <button class="btn btn-primary report-submit-btn w-100" id="eventsSubmit">

                                Xem báo cáo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="report-table-card report-events-table">
                <div class="report-table-header">
                    <h5 class="report-table-title">
                        <i class="fas fa-table me-2"></i>
                        Dữ liệu báo cáo sự kiện
                    </h5>
                </div>
                <div class="report-table-wrapper">
                    <table class="table report-events-table-content">
                        <thead>
                            <tr>
                                <th>Thời điểm</th>
                                <th>Sự kiện</th>
                                <th>Ghi chú</th>
                                <th>Địa điểm</th>
                                <th></th>
                            </tr>
                        </thead>
                        <tbody id="eventsTableBody">
                            <tr class="report-empty-row">
                                <td colspan="5" class="text-center py-5">
                                    <i class="fas fa-inbox fa-3x text-muted mb-3 d-block"></i>
                                    <p class="text-muted">Chưa có dữ liệu. Vui lòng chọn bộ lọc và nhấn "Xem báo cáo"
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
