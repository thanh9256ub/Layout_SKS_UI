<body>
    <div class="report-page report-temperature-page">
        <div class="report-page-header">
            <h2 class="report-page-title">
                <i class="fas fa-thermometer-half me-2"></i>
                Báo cáo chi tiết nhiệt độ
            </h2>

        </div>
        <div class="report-page-body">
            <div class="report-filter-card">
                <div class="report-filter-header">
                    <h5 class="report-filter-title">
                        <i class="fas fa-filter me-2"></i>
                        Bộ lọc
                    </h5>
                </div>
                <div class="report-filter-content">
                    <div class="row g-3">
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-car me-1"></i>
                                Biển số
                            </label>
                            <input type="text" class="report-form-control" placeholder="Nhập biển số">
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="temperatureDate">
                                <i class="fas fa-calendar-alt report-input-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-clock me-1"></i>
                                Từ giờ
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" value="00:00:00"
                                    id="temperatureTimeFrom">
                                <i class="fas fa-clock report-input-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-clock me-1"></i>
                                Đến giờ
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" value="23:59:59" id="temperatureTimeTo">
                                <i class="fas fa-clock report-input-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-12">
                            <label for=""></label>
                            <button class="btn btn-primary report-submit-btn w-100" id="temperatureSubmit">

                                Xem báo cáo
                            </button>
                        </div>
                    </div>
                    <div class="row g-3 mt-2">
                        <div class="col-3">
                            <div class="report-checkbox-wrapper">
                                <input type="checkbox" id="temperatureLocationCheck" class="report-checkbox">
                                <label for="temperatureLocationCheck" class="report-checkbox-label">
                                    <i class="fas fa-map-marker-alt me-2"></i>
                                    Nhận diện địa điểm
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="report-table-card report-temperature-table">
                <div class="report-table-header">
                    <h5 class="report-table-title">
                        <i class="fas fa-table me-2"></i>
                        Dữ liệu báo cáo
                    </h5>
                </div>
                <div class="report-table-wrapper">
                    <table class="table report-temperature-table-content">
                        <thead>
                            <tr>
                                <th>Thời điểm</th>
                                <th>Tọa độ</th>
                                <th>Tốc độ</th>
                                <th>Trạng thái máy</th>
                                <th>Trạng thái GPS</th>
                                <th>Temper A (oC)</th>
                                <th>Temper B (oC)</th>
                                <th>Địa chỉ</th>
                                <th>Độ rung</th>
                            </tr>
                        </thead>
                        <tbody id="temperatureTableBody">
                            <tr class="report-empty-row">
                                <td colspan="9" class="text-center py-5">
                                    <i class="fas fa-inbox fa-3x text-muted mb-3 d-block"></i>
                                    <p class="text-muted">Chưa có dữ liệu. Vui lòng chọn bộ lọc và nhấn "Xem báo cáo"
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
