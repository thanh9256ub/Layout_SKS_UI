<body>
    <div class="report-page report-fuel-usage-page">
        <div class="report-page-header">
            <h2 class="report-page-title">
                <i class="fas fa-gas-pump me-2"></i>
                BÁO CÁO SỬ DỤNG NHIÊN LIỆU
            </h2>

        </div>
        <div class="report-page-body">
            <div class="report-filter-card report-fuel-usage-filter">
                <div class="report-filter-header">
                    <h5 class="report-filter-title">
                        <i class="fas fa-filter me-2"></i>
                        Bộ lọc
                    </h5>
                </div>
                <div class="report-filter-content">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-car me-1"></i>
                                Biển số
                            </label>
                            <input type="text" class="report-form-control" placeholder="Nhập biển số"
                                id="fuelUsagePlate">
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Từ ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="fuelUsageDateFrom"
                                    value="27/11/2025">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Đến ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="fuelUsageDateTo" value="27/11/2025">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-12">
                            <label for=""></label>
                            <button class="btn btn-primary report-submit-btn w-100" id="fuelUsageSubmit">

                                Xem báo cáo
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="report-table-card report-fuel-usage-table">
                <div class="report-table-header">
                    <h5 class="report-table-title">
                        <i class="fas fa-table me-2"></i>
                        Dữ liệu báo cáo dữ liệu sử dụng nhiên liệu
                    </h5>
                </div>
                <div class="report-table-wrapper">
                    <table class="table report-fuel-usage-table-content">
                        <thead>
                            <tr>
                                <th>Biển số</th>
                                <th>Ngày</th>
                                <th>Thời điểm</th>
                                <th>Trong bình (lít)</th>
                                <th>Tồn đầu (lít)</th>
                                <th>Cấp thêm (lít)</th>
                                <th>Tiêu thụ (lít)</th>
                                <th>Tồn cuối (lít)</th>
                                <th>Địa điểm</th>
                            </tr>
                        </thead>
                        <tbody id="fuelUsageTableBody">
                            <tr class="report-empty-row">
                                <td colspan="9" class="text-center py-5">
                                    <i class="fas fa-inbox fa-3x text-muted mb-3 d-block"></i>
                                    <p class="text-muted">Chưa có dữ liệu. Vui lòng chọn bộ lọc và nhấn "Xem báo cáo"
                                    </p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
