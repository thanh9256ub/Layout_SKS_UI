<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skysoft Go</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

</head>


<body>
    <section id="sp-main-body">
        <div class="container-fluid">
            <div class="main-content bg-white oil-chart-screen">
                <div id="chart">
                    <div class="container-fluid">
                        <div class="oil-chart-container">
                            <div class="oil-chart-header">
                                <h2 class="oil-chart-title"><i class="fa-solid fa-chart-simple"></i> Biểu đồ</h2>
                                <div class="oil-chart-info">
                                    <div class="oil-chart-info-item" style="position: relative;">
                                        <span class="oil-chart-info-label"><i class="fa-solid fa-car-side"></i> Biển
                                            số:</span>
                                        <input type="text" id="licensePlate" value="" placeholder="Nhập biển số xe">
                                        <ul id="suggestionList" class="oil-chart-suggestion-list"></ul>
                                    </div>
                                    <div class="oil-chart-info-item">
                                        <span class="oil-chart-info-label"><i class="fa-solid fa-calendar-days"></i>
                                            Ngày:</span>
                                        <input type="date" id="date">
                                    </div>
                                </div>
                            </div>
                            <canvas id="fuelChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/local-fetch.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/navbar-loader.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/home/navbar.js"></script>

</body>

</html>
