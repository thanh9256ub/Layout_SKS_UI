<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skysoft Go</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

</head>

<body>
    <section id="sp-main-body">
        <div class="container-fluid">
            <div class="main-content report-screen">
                <div class="row report-row">
                    <!-- Sidebar bên trái -->
                    <div class="col-12 col-sm-3 report-sidebar-col">
                        <div class="report-sidebar">
                            <div class="report-sidebar-header">
                                <h3 class="report-sidebar-title">
                                    <i class="fas fa-chart-line me-2"></i>
                                    <span class="report-sidebar-title-text">Danh sách báo cáo</span>
                                </h3>
                                <button class="report-sidebar-toggle" type="button"
                                    aria-label="Thu gọn danh sách đếm chuyến" aria-expanded="true">
                                    <i class="fas fa-chevron-left"></i>
                                </button>
                            </div>
                            <div class="report-sidebar-content">
                                <ul class="report-list" id="reportList">
                                    <li class="report-item active" data-report="water-pump">
                                        <div class="report-item-content">
                                            <i class="report-item-icon fas fa-tint"></i>
                                            <span class="report-item-text">Đếm chuyến đơn điểm</span>
                                        </div>
                                        <i class="report-item-arrow fas fa-chevron-right"></i>
                                    </li>
                                    <li class="report-item" data-report="vibration">
                                        <div class="report-item-content">
                                            <i class="report-item-icon fas fa-bell"></i>
                                            <span class="report-item-text">Đếm chuyến đa điểm</span>
                                        </div>
                                        <i class="report-item-arrow fas fa-chevron-right"></i>
                                    </li>
                                    <li class="report-item" data-report="ac">
                                        <div class="report-item-content">
                                            <i class="report-item-icon fas fa-snowflake"></i>
                                            <span class="report-item-text">Đếm chuyến theo cung độ (Từ điểm)</span>
                                        </div>
                                        <i class="report-item-arrow fas fa-chevron-right"></i>
                                    </li>
                                    <li class="report-item" data-report="tire-pressure">
                                        <div class="report-item-content">
                                            <i class="report-item-icon fas fa-circle"></i>
                                            <span class="report-item-text">Đếm chuyến theo cung độ (Đến điểm)</span>
                                        </div>
                                        <i class="report-item-arrow fas fa-chevron-right"></i>
                                    </li>
                                </ul>
                            </div>
                        </div>
                    </div>

                    <!-- Nội dung bên phải -->
                    <div class="col-12 col-sm-9 report-content-col">
                        <div class="report-content-wrapper">
                            <div class="report-content" id="reportContent">
                                <!-- Nội dung sẽ được load động -->
                                <div class="report-loading">
                                    <div class="spinner-border text-warning" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/local-fetch.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/navbar-loader.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/home/navbar.js"></script>

</body>

</html>
