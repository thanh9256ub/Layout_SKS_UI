<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skysoft Go</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

</head>


<body>
    <section id="sp-main-body">
        <div class="container-fluid">
            <div class="main-content stream-screen">
                <div class="stream-layout-container">
                    <div class="stream-left-sidebar">
                        <div class="stream-vehicle-sidebar">
                            <!-- <div class="stream-selected-vehicle">
                                <div class="selected-vehicle-info">
                                    <i class="fas fa-car-side"></i>
                                    <span id="selectedVehiclePlate">Chưa chọn xe</span>
                                </div>
                            </div> -->
                            <div class="stream-search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="streamVehicleSearch" placeholder="Tìm biển số xe..."
                                    autocomplete="off">
                            </div>
                            <div class="stream-vehicle-list" id="streamVehicleList">
                            </div>
                        </div>
                        <div id="map-container" class="route-map-container">
                            <div id="map"></div>
                        </div>
                    </div>
                    <div class="stream-camera-area">
                        <div class="stream-controls-header">
                            <div class="stream-layout-selector">
                                <label class="stream-layout-label">
                                    <i class="fas fa-th"></i> Bố cục:
                                </label>
                                <div class="stream-layout-buttons">
                                    <button class="stream-layout-btn" data-layout="1" title="1 camera">
                                        <i class="fas fa-square"></i>
                                    </button>
                                    <button class="stream-layout-btn active" data-layout="4" title="4 cameras (2x2)">
                                        <i class="fas fa-th-large"></i>
                                    </button>
                                    <button class="stream-layout-btn" data-layout="6" title="6 cameras (2x3)">
                                        <i class="fas fa-grip-horizontal"></i>
                                    </button>
                                    <button class="stream-layout-btn" data-layout="8" title="8 cameras (4x2)">
                                        <i class="fas fa-grip-horizontal"></i>
                                    </button>
                                    <button class="stream-layout-btn" data-layout="9" title="9 cameras (3x3)">
                                        <i class="fas fa-th"></i>
                                    </button>
                                    <button class="stream-layout-btn" data-layout="16" title="16 cameras (4x4)">
                                        <i class="fas fa-border-all"></i>
                                    </button>
                                    <button class="stream-layout-btn" data-layout="36" title="36 cameras (6x6)">
                                        <i class="fas fa-th"></i>
                                    </button>
                                    <!-- <button class="stream-layout-btn" data-layout="32" title="32 cameras (4x8)">
                                        <i class="fas fa-table-cells-large"></i>
                                    </button> -->
                                </div>
                            </div>
                        </div>

                        <div class="stream-camera-grid-wrapper">
                            <div class="stream-camera-container grid-4" id="streamCameraContainer"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/local-fetch.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/navbar-loader.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/home/navbar.js"></script>
</body>

</html>
