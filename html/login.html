<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Skysoft Go</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
</head>

<body class="login-page">
    <div class="login-container">
        <div class="login-wrapper">
            <!-- Left side - Branding -->
            <div class="login-branding">
                <div class="branding-content">
                    <div class="logo-container">
                        <img src="../images/skysoft_logo.png" alt="Skysoft Logo" class="brand-logo">
                    </div>
                    <h1 class="brand-title">Skysoft Go</h1>
                    <p class="brand-subtitle">Hệ thống quản lý và giám sát phương tiện thông minh</p>

                </div>
            </div>

            <!-- Right side - Login Form -->
            <div class="login-form-container">
                <div class="login-form-card">
                    <div class="login-form-header">
                        <h2 class="login-title">Đăng nhập</h2>
                        <p class="login-subtitle">Vui lòng nhập thông tin đăng nhập của bạn</p>
                    </div>

                    <form id="loginForm" class="login-form" novalidate>
                        <div class="form-group-login">
                            <label for="username" class="form-label">
                                <i class="fas fa-user"></i>
                                Tên đăng nhập
                            </label>
                            <div class="input-wrapper">
                                <input type="text" class="form-control-login" id="username" name="username"
                                    placeholder="Nhập tên đăng nhập" autocomplete="username" required>
                                <i class="input-icon fas fa-user"></i>
                            </div>
                            <div class="invalid-feedback">
                                Vui lòng nhập tên đăng nhập
                            </div>
                        </div>

                        <div class="form-group-login">
                            <label for="password" class="form-label">
                                <i class="fas fa-lock"></i>
                                Mật khẩu
                            </label>
                            <div class="input-wrapper">
                                <input type="password" class="form-control-login" id="password" name="password"
                                    placeholder="Nhập mật khẩu" autocomplete="current-password" required>
                                <button type="button" class="password-toggle" id="togglePassword"
                                    aria-label="Hiện/Ẩn mật khẩu">
                                    <i class="fas fa-eye"></i>
                                </button>
                            </div>
                            <div class="invalid-feedback">
                                Vui lòng nhập mật khẩu
                            </div>
                        </div>

                        <div class="form-options">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe" name="rememberMe">
                                <label class="form-check-label" for="rememberMe">
                                    Ghi nhớ đăng nhập
                                </label>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-login">
                            <span class="btn-text">Đăng nhập</span>
                            <i class="fas fa-arrow-right btn-icon"></i>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/local-fetch.js"></script>
    <script src="../js/login/login.js"></script>
</body>

</html>
