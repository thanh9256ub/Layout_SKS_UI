<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skysoft Go</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

</head>


<body>
    <section id="sp-main-body">
        <div class="container-fluid">
            <div class="main-content bg-white route-screen">
                <div class="row route-row">
                    <div class="col-12 col-sm-2" id="filter">
                        <div class="main-container">
                            <div class="filter-section">
                                <div class="search-plate mb-2">
                                    <label for="vehicleSearchInput" class="form-label-search"><i
                                            class="fas fa-search me-2"></i>Tìm kiếm
                                        xe</label>
                                    <div class="autocomplete-container">
                                        <input type="text" class="form-control-search" id="vehicleSearchInput"
                                            placeholder="Tìm biển số xe...">
                                        <div class="autocomplete-results" id="autocompleteResults"></div>
                                    </div>
                                </div>
                                <div class="custom-dropdown mb-2">
                                    <label for="groupFilterSelectTime" class="form-label-search"><i
                                            class="fas fa-filter me-2"></i>Điều
                                        kiện</label>
                                    <select id="groupFilterSelectTime" class="rounded">
                                        <option value="1" selected>1 giờ gần đây</option>
                                        <option value="2">4 giờ gần đây</option>
                                        <option value="3">6 giờ gần đây</option>
                                        <option value="4">12 giờ gần đây</option>
                                        <option value="5">24 giờ gần đây</option>
                                        <option value="6">Ngày hôm nay</option>
                                        <option value="7">Ngày hôm qua</option>
                                        <option value="8">Điều kiện khác</option>
                                    </select>
                                </div>
                                <div class="custom-dropdown mb-2">
                                    <label for="groupFilterSelectType" class="form-label-search"><i
                                            class="fas fa-filter me-2"></i>Nhóm xe</label>
                                    <select id="groupFilterSelectType" class="rounded">
                                            <option value="all">Tất cả nhóm</option>
                                        <option value="camera">Nhóm TB Cam quay</option>
                                        <option value="taxi">Nhóm Taxi M8</option>
                                        <option value="bus">Nhóm xe Bus - Camera</option>
                                            <option value="truck">Nhóm xe tải hàng - Cảm biến dầu</option>
                                    </select>
                                </div>
                                <button type="button" class="btn btn-primary-custom w-100 mb-2" id="searchRoutesBtn">
                                    <i class="fas fa-search me-2"></i>Tìm kiếm
                                </button>
                            </div>

                            <div class="table-container">
                                <!-- Empty State -->
                                <div id="emptyState" class="empty-state">
                                    <i class="fas fa-search-location"></i>
                                    <h4>Chưa có kết quả tìm kiếm</h4>
                                    <p>Hãy nhập biển số xe bạn muốn tìm kiếm để xem lộ trình</p>
                                </div>

                                <!-- Loading Indicator -->
                                <div id="loadingIndicator" class="loading-spinner" style="display: none;">
                                    <div class="spinner"></div>
                                </div>

                                <!-- Results Table -->
                                <div id="resultsTable" style="display: none;">
                                    <div class="table-responsive">
                                        <table class="table-filter table-hover mb-0">
                                            <thead>
                                                <tr>
                                                    <th>Thời điểm</th>
                                                    <th>VT</th>
                                                    <th>Km</th>
                                                    <th>Máy</th>
                                                </tr>
                                            </thead>
                                            <tbody id="vehicleTableBody">
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <!-- Progress Bar -->
                                <div class="route-progress-container" id="routeProgressContainer"
                                    style="display: none;">
                                    <div class="route-progress-bar">
                                        <div class="route-progress-fill" id="routeProgressFill"></div>
                                    </div>
                                </div>

                                <!-- Control Buttons -->
                                <div class="table-controls" id="tableControls" style="display: none;">
                                    <button class="btn-control" id="prevBtn" title="Điểm trước">
                                        <i class="fas fa-chevron-left"></i>
                                    </button>
                                    <!-- <button class="btn-control" id="rewindBtn" title="Về đầu">
                                        <i class="fa-solid fa-backward"></i>
                                    </button> -->
                                    <button class="btn-control" id="toggleRouteBtn" title="Ẩn/Hiện lộ trình">
                                        <i class="fas fa-eye"></i>
                                    </button>
                                    <button class="btn-control" id="playBtn" title="Phát">
                                        <i class="fas fa-play"></i>
                                    </button>
                                    <!-- <button class="btn-control" id="fastBtn" title="Đến cuối">
                                        <i class="fas fa-forward"></i>
                                    </button> -->
                                    <button class="btn-control" id="nextBtn" title="Điểm tiếp">
                                        <i class="fas fa-chevron-right"></i>
                                    </button>
                                    <div style="display: flex; align-items: center; gap: 4px; margin-left: auto;">
                                        <button class="btn-control" id="speedDownBtn" title="Giảm tốc độ">
                                            <i class="fas fa-minus"></i>
                                        </button>
                                        <div style="min-width: 30px; text-align: center; font-weight: 600; font-size: 13px; color: #1f2937;"
                                            id="speedDisplay">x1</div>
                                        <button class="btn-control" id="speedUpBtn" title="Tăng tốc độ">
                                            <i class="fas fa-plus"></i>
                                        </button>
                                    </div>
                                </div>

                                <div id="noResults" class="no-results" style="display: none;">
                                    <i class="fas fa-search"></i>
                                    <h4>Không tìm thấy lộ trình</h4>
                                    <p>Xe này không có lộ trình trong khoảng thời gian được chọn</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-sm-10 route-map-col">
                        <div id="map-container" class="route-map-container">
                            <div id="map"></div>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/local-fetch.js"></script>
    <script src="../js/auth-guard.js"></script>
    <script src="../js/navbar-loader.js"></script>
    <script src="../js/router.js"></script>
    <script src="../js/home/navbar.js"></script>
</body>

</html>
