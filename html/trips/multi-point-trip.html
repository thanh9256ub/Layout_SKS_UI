<body>
    <div class="report-page report-multi-point-page">
        <div class="report-page-header">
            <h2 class="report-page-title">
                <i class="fas fa-bell me-2"></i>
                ĐẾM CHUYẾN ĐA ĐIỂM (ĐẾN NHÓM ĐIỂM)
            </h2>

        </div>
        <div class="report-page-body">
            <div class="report-filter-card report-multi-point-filter">
                <div class="report-filter-header">
                    <h5 class="report-filter-title">
                        <i class="fas fa-filter me-2"></i>
                        Đếm chuyến đa điểm (Đến nhóm điểm)
                    </h5>
                </div>
                <div class="report-filter-content">
                    <div class="row g-3">
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-map-marker-alt me-1"></i>
                                Nhóm điểm
                            </label>
                            <div class="report-input-group">
                                <select class="report-form-control" id="multiPointGroup">
                                    <option value="group1">Nhóm 1</option>
                                    <option value="group2">Nhóm 2</option>
                                    <option value="group3">Nhóm 3</option>
                                    <option value="all">Tất cả</option>
                                </select>
                                <i class="fas fa-chevron-down report-select-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-users me-1"></i>
                                Nhóm xe
                            </label>
                            <div class="report-input-group">
                                <select class="report-form-control" id="multiPointVehicleGroup">
                                    <option value="all">Tất cả</option>
                                    <option value="group1">Nhóm 1</option>
                                    <option value="group2">Nhóm 2</option>
                                    <option value="group3">Nhóm 3</option>
                                </select>
                                <i class="fas fa-chevron-down report-select-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-car me-1"></i>
                                Biển số
                            </label>
                            <input type="text" class="report-form-control" placeholder="Nhập biển số"
                                id="multiPointPlate">
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Từ ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="multiPointDateFrom"
                                    value="27/11/2025">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-3 col-sm-6">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Đến ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="multiPointDateTo" value="27/11/2025">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-4">
                            <label class="report-form-label">
                                <i class="fas fa-clock me-1"></i>
                                Từ giờ
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" placeholder="00:00"
                                    id="multiPointTimeFrom">
                                <button type="button" class="report-time-btn">
                                    <i class="fas fa-clock"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-4">
                            <label class="report-form-label">
                                <i class="fas fa-clock me-1"></i>
                                Đến giờ
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" placeholder="23:59"
                                    id="multiPointTimeTo">
                                <button type="button" class="report-time-btn">
                                    <i class="fas fa-clock"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-12">
                            <label class="report-form-label">&nbsp;</label>
                            <button class="btn btn-primary report-submit-btn w-100" id="multiPointSubmit">
                                Đếm chuyến
                            </button>
                        </div>
                    </div>
                    <div class="row g-3 mt-2">
                        <div class="col-auto">
                            <div class="report-checkbox-wrapper">
                                <input type="checkbox" id="multiPointHasStop" class="report-checkbox">
                                <label for="multiPointHasStop" class="report-checkbox-label">
                                    Có dừng
                                </label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <div class="report-checkbox-wrapper">
                                <input type="checkbox" id="multiPointHasLiftSide" class="report-checkbox">
                                <label for="multiPointHasLiftSide" class="report-checkbox-label">
                                    Có nâng ben
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="report-table-card report-multi-point-table">

                <div class="report-table-wrapper">
                    <table class="table report-multi-point-table-content">
                        <thead>
                            <tr>
                                <th>Biển số</th>
                                <th>Đến điểm</th>
                                <th>Ngày đến</th>
                                <th>Thời điểm đến</th>
                                <th>Ngày đi</th>
                                <th>Thời điểm đi</th>
                                <th>Thời gian ở</th>
                                <th>TG so với chuyến trước</th>
                                <th>Dừng</th>
                                <th>Nâng ben</th>
                            </tr>
                        </thead>
                        <tbody id="multiPointTableBody">
                            <tr class="report-empty-row">
                                <td colspan="10" class="text-center py-5">
                                    <i class="fas fa-inbox fa-3x text-muted mb-3 d-block"></i>
                                    <p class="text-muted">Chưa có dữ liệu. Vui lòng chọn bộ lọc và nhấn "Đếm chuyến"</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
