<body>
    <div class="report-page report-single-point-page">
        <div class="report-page-header">
            <h2 class="report-page-title">
                <i class="fas fa-tint me-2"></i>
                Đếm chuyến đơn điểm
            </h2>

        </div>
        <div class="report-page-body">
            <div class="report-filter-card report-single-point-filter">
                <div class="report-filter-header">
                    <h5 class="report-filter-title">
                        <i class="fas fa-filter me-2"></i>
                        Đếm chuyến đơn điểm (Đến điểm)
                    </h5>
                </div>
                <div class="report-filter-content">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="report-form-label">
                                <i class="fas fa-map-marker-alt me-1"></i>
                                Điểm
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" placeholder="Nhập điểm cần đếm"
                                    id="singlePointLocation">
                                <button type="button" class="report-input-btn">
                                    <i class="fas fa-search"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <label class="report-form-label">
                                <i class="fas fa-users me-1"></i>
                                Nhóm xe
                            </label>
                            <div class="report-input-group">
                                <select class="report-form-control" id="singlePointGroup">
                                    <option value="all">Tất cả</option>
                                    <option value="group1">Nhóm 1</option>
                                    <option value="group2">Nhóm 2</option>
                                    <option value="group3">Nhóm 3</option>
                                </select>
                                <i class="fas fa-chevron-down report-select-icon"></i>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="report-form-label">
                                <i class="fas fa-car me-1"></i>
                                Biển số
                            </label>
                            <input type="text" class="report-form-control" placeholder="Nhập biển số"
                                id="singlePointPlate">
                        </div>
                        <div class="col-md-3">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Từ ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="singlePointDateFrom"
                                    value="27/11/2025">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <label class="report-form-label">
                                <i class="fas fa-clock me-1"></i>
                                Từ giờ
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" placeholder="00:00"
                                    id="singlePointTimeFrom">
                                <button type="button" class="report-time-btn">
                                    <i class="fas fa-clock"></i>
                                </button>
                            </div>

                        </div>
                        <div class="col-md-2">
                            <label for=""></label>
                            <button class="btn btn-primary report-submit-btn w-100" id="singlePointSubmit"
                                title="Đếm chuyến" aria-label="Đếm chuyến">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                    <div class="row g-3 mt-2">
                        <div class="col-md-2 col-sm-4">
                            <label class="report-form-label">
                                <i class="fas fa-calendar me-1"></i>
                                Đến ngày
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" id="singlePointDateTo"
                                    value="27/11/2025">
                                <button type="button" class="report-calendar-btn">
                                    <i class="fas fa-calendar-alt"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-md-2 col-sm-4">
                            <label class="report-form-label">
                                <i class="fas fa-clock me-1"></i>
                                Đến giờ
                            </label>
                            <div class="report-input-group">
                                <input type="text" class="report-form-control" placeholder="23:59"
                                    id="singlePointTimeTo">
                                <button type="button" class="report-time-btn">
                                    <i class="fas fa-clock"></i>
                                </button>
                            </div>
                        </div>
                        <div class="col-auto">
                            <label class="report-form-label">&nbsp;</label>
                            <div class="report-checkbox-wrapper">
                                <input type="checkbox" id="singlePointUseAdvanced" class="report-checkbox">
                                <label for="singlePointUseAdvanced" class="report-checkbox-label">
                                    Có dùng
                                </label>
                            </div>
                        </div>
                        <div class="col-auto">
                            <label class="report-form-label">&nbsp;</label>
                            <div class="report-checkbox-wrapper">
                                <input type="checkbox" id="singlePointUseLifted" class="report-checkbox">
                                <label for="singlePointUseLifted" class="report-checkbox-label">
                                    Có nâng ben
                                </label>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="report-table-card report-single-point-table">

                <div class="report-table-wrapper">
                    <table class="table report-single-point-table-content">
                        <thead>
                            <tr>
                                <th>Biển số</th>
                                <th>Ngày đến</th>
                                <th>Thời điểm đến</th>
                                <th>Ngày đi</th>
                                <th>Thời điểm đi</th>
                                <th>Thời gian ở</th>
                                <th>TG so với chuyến trước</th>
                                <th>Số KM đi chuyển</th>
                                <th>Dừng</th>
                                <th>Nâng bên</th>
                            </tr>
                        </thead>
                        <tbody id="singlePointTableBody">
                            <tr class="report-empty-row">
                                <td colspan="10" class="text-center py-5">
                                    <i class="fas fa-inbox fa-3x text-muted mb-3 d-block"></i>
                                    <p class="text-muted">Chưa có dữ liệu. Vui lòng chọn bộ lọc và nhấn "Đếm chuyến"</p>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
